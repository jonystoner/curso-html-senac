<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Senac</title>
</head>

<body>
    <h2>Venha conhecer nossos produtos</h2>
    <table border="2">
        <tr>
            <th>Produto</th>
            <th>Categoria </th>
            <th>Preço</th>
            <th>Disponivel</th>
        </tr>
        <tr>
            <td>Arroz 20 KG</td>
            <td>Alimento</td>
            <td>R$ 29,90</td>
            <td>Sim</td>
        </tr>
        <tr>
            <td>Feijão</td>
            <td>Alimento</td>
            <td>R$ 7,50</td>
            <td>Sim</td>
        </tr>
        <tr>
            <td>Macarrão</td>
            <td>Alimento</td>
            <td>R$ 3,99</td>
            <td>Não</td>
        </tr>
        <tr>
            <td>Suco de Uva 500 ml</td>
            <td>Bebidas</td>
            <td>R$ 8,99</td>
        </tr>
        <tr>
            <td>Coca-cola 1,5L</td>
            <td>Bebida</td>
            <td>R$ 9,99</td>
        </tr>
    </table>
    <h2> Formulario de Pedidos </h2>
    <form action="" method="post" name="">
        <p>
            <label for="arroz">Arroz</label>
            <input type="radio" id="arroz" name="">
            <label for="quantidade"> QT</label>
            <input type="number" min="1" max="15" id="quantidade" name="">
        </p>
        <p>
            <label for="feijao">Feijão</label>
            <input type="radio" id="feijao" name="">
            <label for="" >QT</label>

            <input type="number" min="1" max="15" id="" name="">
        </p>
        <p>
            <label for="">Macarrão</label>
            <input type="radio" id="" name="">

            <label> QT</label>
            <input type="number" min="1" max="15" id="" name="">
        </p>
        <p>
            <label for="">Suco de Uva 500 ml</label>
            <input type="radio" id="" name="">

            <label> QT</label>
            <input type="number" min="1" max="15" id="" name="">
        </p>
        <p>
            <label for="">Coca-cola 1,5L</label>
            <input type="radio" id="" name="">
            <label> QT</label>
            <input type="number" min="1" max="15" id="" name="">
        </p>

        <h4> Informe seus dados para podermos finalizar</h4>
        <p>
            <label for="name">Nome</label>
            <input type="text" placeholder="Informe seu Nome" id="nome" name="nome">
        </p>
        <p>
            <label for="email">E-mail</label>
            <input type="email" placeholder="Informe seu Nome" id="email" name="email">
        </p>
        <p>
            <select>
                <option> Selecione uma opção de pagamento</option>
                <option>Pix</option>
                <option>Debito</option>
                <option>Credito</option>
                <option>Boleto</option>
            </select>
        </p>

        <button id="" onclick="">Enviar</button>

    </form>
</body>

</html>
